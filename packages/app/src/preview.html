<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AppKit Inspector</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f2f2f4, #171719);
        --panel: light-dark(#fbfbfc, #222225);
        --sidebar: light-dark(#e9e9ed, #29292d);
        --line: light-dark(#d2d2d7, #3c3c41);
        --text: light-dark(#202024, #f2f2f4);
        --muted: light-dark(#66666d, #a4a4aa);
        --accent: #0a84ff;
        --selection: color-mix(in srgb, var(--accent) 17%, transparent);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--text); overflow: hidden; font-size: 13px; }
      button, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
      .shell { height: 100%; min-height: 380px; display: grid; grid-template-rows: 44px minmax(0, 1fr); }
      .shell.mode-window { min-height: 640px; }
      .shell.mode-fullscreen { min-height: 100%; }
      .launcher-shell { height: 100%; min-height: 140px; display: grid; grid-template-rows: 44px minmax(0, 1fr); background: var(--panel); }
      .toolbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .toolbar strong { font-size: 13px; }
      .toolbar .status { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
      .toolbar .spacer { flex: 1; }
      .toolbar button, .send, .primary-action, .secondary-action { min-height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
      .toolbar button:disabled { cursor: default; opacity: .45; }
      .toolbar button:hover, .send:hover { background: color-mix(in srgb, var(--text) 7%, var(--panel)); }
      .zoom-controls { flex: none; display: flex; align-items: center; gap: 4px; }
      .zoom-controls button { min-width: 28px; padding-inline: 7px; }
      .zoom-controls button[aria-pressed="true"] { background: var(--selection); border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); }
      .zoom-controls output { width: 42px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
      .launcher { min-height: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 16px; }
      .launcher > div:first-child { min-width: 0; display: grid; gap: 4px; }
      .launcher strong { font-size: 13px; }
      .launcher span { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
      .launcher-actions { flex: none; display: flex; align-items: center; gap: 8px; }
      .primary-action { flex: none; min-height: 32px; color: white; border-color: var(--accent); background: var(--accent); font-weight: 600; }
      .primary-action:hover { background: color-mix(in srgb, var(--accent) 88%, white); }
      .secondary-action { min-height: 32px; }
      .secondary-action:hover { background: color-mix(in srgb, var(--text) 7%, var(--panel)); }
      .primary-action:disabled, .secondary-action:disabled { cursor: default; opacity: .55; }
      .content { min-height: 0; display: grid; grid-template-columns: minmax(360px, 1fr) 310px; }
      .stage { min-width: 0; min-height: 0; overflow: auto; background: var(--bg); }
      .canvas { min-width: 100%; min-height: 100%; width: max-content; height: max-content; display: grid; place-items: center; padding: 24px; }
      .screen { position: relative; flex: none; filter: drop-shadow(0 12px 28px #0004); }
      .screen img { display: block; width: 100%; height: 100%; border-radius: 12px; user-select: none; }
      .hit-surface { position: absolute; inset: 0; border: 0; padding: 0; border-radius: 12px; background: transparent; }
      .highlight { position: absolute; pointer-events: none; border: 2px solid var(--accent); background: var(--selection); box-shadow: 0 0 0 1px #fff8 inset, 0 0 0 1px #0003; }
      .inspector { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(120px, 1fr) auto; border-left: 1px solid var(--line); background: var(--panel); }
      .summary { padding: 14px; border-bottom: 1px solid var(--line); }
      .summary h2 { margin: 0 0 5px; font-size: 14px; }
      .summary p { margin: 0; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
      .tree { min-height: 0; overflow: auto; padding: 8px; background: var(--sidebar); }
      .tree button { width: 100%; min-height: 28px; display: block; overflow: hidden; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
      .tree button:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
      .tree button.selected { color: white; background: var(--accent); }
      .tree small { opacity: .72; }
      .review { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
      textarea { min-height: 68px; resize: vertical; padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
      .send { color: white; border-color: var(--accent); background: var(--accent); font-weight: 600; }
      .send:disabled { cursor: default; opacity: .5; }
      .toast { min-height: 16px; color: var(--muted); font-size: 11px; }
      .startup { min-height: 0; display: grid; place-items: center; padding: 32px; color: var(--muted); text-align: center; }
      .startup strong { display: block; margin-bottom: 6px; color: var(--text); }
      @media (max-width: 900px) { .toolbar .status { display: none; } }
      @media (max-width: 640px) { .launcher { gap: 10px; padding-inline: 12px; } .launcher > div:first-child { display: none; } .launcher-actions { width: 100%; } .launcher-actions button { flex: 1; } }
      @media (max-width: 760px) { .content { grid-template-columns: 1fr; grid-template-rows: minmax(340px, 1fr) 280px; } .inspector { grid-template-rows: auto minmax(80px, 1fr) auto; border-left: 0; border-top: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="launcher-shell" data-startup-surface="true">
        <header class="toolbar"><strong>AppKit Inspector</strong><span class="status">Starting…</span></header>
        <section class="launcher" role="status"><div><strong>Inspect the connected AppKit app</strong><span>Selecting the best Inspector surface…</span></div><div class="launcher-actions"><button type="button" class="secondary-action" disabled>Open in Codex Browser</button><button type="button" class="primary-action" disabled>Open Inspector</button></div></section>
      </main>
    </div>
    <script>
      window.addEventListener("error", (event) => {
        const root = document.querySelector("#app");
        if (!root) return;
        root.innerHTML = `<main class="shell"><header class="toolbar"><strong>AppKit Inspector</strong></header><div class="startup" role="alert"><div><strong>Inspector could not start</strong><span>${event.message || "Unknown JavaScript error"}</span></div></div></main>`;
      });
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AppKit Inspector</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f2f2f4, #171719);
        --panel: light-dark(#fbfbfc, #222225);
        --sidebar: light-dark(#e9e9ed, #29292d);
        --line: light-dark(#d2d2d7, #3c3c41);
        --text: light-dark(#202024, #f2f2f4);
        --muted: light-dark(#66666d, #a4a4aa);
        --accent: #0a84ff;
        --selection: color-mix(in srgb, var(--accent) 17%, transparent);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--text); overflow: hidden; font-size: 13px; }
      button, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
      .shell { height: 100%; min-height: 640px; display: grid; grid-template-rows: 44px minmax(0, 1fr); }
      .toolbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .toolbar strong { font-size: 13px; }
      .toolbar .status { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
      .toolbar .spacer { flex: 1; }
      .toolbar button, .send { min-height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
      .toolbar button:hover, .send:hover { background: color-mix(in srgb, var(--text) 7%, var(--panel)); }
      .content { min-height: 0; display: grid; grid-template-columns: minmax(360px, 1fr) 310px; }
      .stage { min-width: 0; min-height: 0; display: grid; place-items: center; padding: 24px; overflow: auto; background: var(--bg); }
      .screen { position: relative; max-width: 100%; max-height: 100%; filter: drop-shadow(0 12px 28px #0004); }
      .screen img { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 94px); border-radius: 12px; user-select: none; }
      .hit-surface { position: absolute; inset: 0; border: 0; padding: 0; border-radius: 12px; background: transparent; }
      .highlight { position: absolute; pointer-events: none; border: 2px solid var(--accent); background: var(--selection); box-shadow: 0 0 0 1px #fff8 inset, 0 0 0 1px #0003; }
      .inspector { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(120px, 1fr) auto; border-left: 1px solid var(--line); background: var(--panel); }
      .summary { padding: 14px; border-bottom: 1px solid var(--line); }
      .summary h2 { margin: 0 0 5px; font-size: 14px; }
      .summary p { margin: 0; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
      .tree { min-height: 0; overflow: auto; padding: 8px; background: var(--sidebar); }
      .tree button { width: 100%; min-height: 28px; display: block; overflow: hidden; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
      .tree button:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
      .tree button.selected { color: white; background: var(--accent); }
      .tree small { opacity: .72; }
      .review { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
      textarea { min-height: 68px; resize: vertical; padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
      .send { color: white; border-color: var(--accent); background: var(--accent); font-weight: 600; }
      .send:disabled { cursor: default; opacity: .5; }
      .toast { min-height: 16px; color: var(--muted); font-size: 11px; }
      @media (max-width: 760px) { .content { grid-template-columns: 1fr; grid-template-rows: minmax(340px, 1fr) 280px; } .inspector { grid-template-rows: auto minmax(80px, 1fr) auto; border-left: 0; border-top: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
